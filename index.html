<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Untuk Kamu 💖</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Comic Sans MS;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    text-align:center;
}

h1{
    color:white;
    font-size:60px;
    animation:goyang 1s infinite;
}

p{
    color:white;
    font-size:25px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    transition:0.2s;
    background:white;
    color:#ff4d6d;
    font-weight:bold;
    position:relative;
}

button:hover{
    transform:scale(1.1);
}

/* Animasi goyang */

@keyframes goyang{
    0%{transform:rotate(-3deg);}
    50%{transform:rotate(3deg);}
    100%{transform:rotate(-3deg);}
}

/* Emoji jatuh */

.emoji{
    position:absolute;
    top:-20px;
    font-size:30px;
    animation:jatuh linear forwards;
}

@keyframes jatuh{
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

</style>
</head>

<body>

<h1 id="judul">
    Alo Adek 😳💖
</h1>

<p id="pesan">
    Ada Pesan Nih Buat Adek...
</p>

<button id="tombol" onclick="romantis()">
    Coba Agak di Klik mhehe 🥺
</button>

<script>

function romantis(){

    document.getElementById("judul").innerHTML =
    "Abang Sayang Bgt sama adek huhu, maaf yaa kalo abang banyak salah, maaf juga kalo abang toxic di depan teman abang ataupun teman adek 😭💖";

    document.getElementById("pesan").innerHTML =
    "Kalau adek jadi wifi, abg gamau mau putus hubungan, love u adek 😭📶💖";
}

/* Tombol kabur */

const tombol = document.getElementById("tombol");

tombol.addEventListener("mouseover", () => {

    const x = Math.random() * (window.innerWidth - 200);

    const y = Math.random() * (window.innerHeight - 100);

    tombol.style.position = "absolute";
    tombol.style.left = x + "px";
    tombol.style.top = y + "px";
});

/* Emoji jatuh */

function buatEmoji(){

    const emoji = document.createElement("div");

    emoji.classList.add("emoji");

    const list = ["💖","🥺","😳","😍","💘","💕"];

    emoji.innerHTML =
    list[Math.floor(Math.random()*list.length)];

    emoji.style.left =
    Math.random()*100 + "vw";

    emoji.style.animationDuration =
    (Math.random()*3+2) + "s";

    document.body.appendChild(emoji);

    setTimeout(()=>{
        emoji.remove();
    },5000);
}

setInterval(buatEmoji,300);

</script>

</body>
</html>
